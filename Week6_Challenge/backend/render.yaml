# Render Blueprint (optional). Manual "New Web Service" with Root Directory =
# Week6_Challenge/backend works just as well and is what this project was verified
# against — this file is provided for convenience if you prefer Blueprint-based setup.
services:
  - type: web
    name: ai-workspace-backend
    runtime: python
    plan: free
    rootDir: Week6_Challenge/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false
